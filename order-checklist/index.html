<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>発注チェックリスト</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Hiragino Sans', 'Meiryo', sans-serif; background: #f5f5f5; color: #333; }
    .header { background: #8e44ad; color: white; padding: 20px 24px; }
    .header h1 { font-size: 22px; font-weight: bold; }
    .header .date { font-size: 13px; margin-top: 4px; opacity: 0.85; }
    .container { max-width: 600px; margin: 0 auto; padding: 16px; }
    .section { background: white; border-radius: 10px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); overflow: hidden; }
    .section-title { background: #e8daef; color: #6c3483; font-weight: bold; font-size: 14px; padding: 10px 16px; border-bottom: 1px solid #d2b4de; }
    .item { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid #faf5ff; cursor: pointer; transition: background 0.15s; }
    .item:last-child { border-bottom: none; }
    .item:hover { background: #f9f5ff; }
    .item input[type="checkbox"] { width: 20px; height: 20px; margin-right: 12px; accent-color: #8e44ad; cursor: pointer; flex-shrink: 0; }
    .item label { font-size: 14px; cursor: pointer; flex: 1; }
    .item.checked label { text-decoration: line-through; color: #aaa; }
    .progress-bar { background: #eee; height: 6px; border-radius: 3px; margin: 12px 16px; }
    .progress-fill { height: 100%; background: #8e44ad; border-radius: 3px; transition: width 0.3s; }
    .progress-text { text-align: right; font-size: 12px; color: #888; margin: -6px 16px 12px; }
    .reset-btn { display: block; width: calc(100% - 32px); margin: 0 16px 16px; padding: 12px; background: #8e44ad; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; }
    .reset-btn:hover { background: #6c3483; }
    .order-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .order-table th { background: #e8daef; color: #6c3483; padding: 8px 12px; text-align: left; font-weight: bold; }
    .order-table td { padding: 8px 12px; border-bottom: 1px solid #f0e8f8; }
    .order-table tr:last-child td { border-bottom: none; }
    .order-table input[type="number"] { width: 60px; padding: 4px 6px; border: 1px solid #d2b4de; border-radius: 4px; font-size: 13px; }
    .order-table input[type="text"] { width: 100%; padding: 4px 6px; border: 1px solid #d2b4de; border-radius: 4px; font-size: 13px; }
    .status-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
    .status-ok { background: #d5f5e3; color: #1e8449; }
    .status-low { background: #fdebd0; color: #d35400; }
    .status-out { background: #fadbd8; color: #c0392b; }
  </style>
</head>
<body>
  <div class="header">
    <h1>発注チェックリスト</h1>
    <div class="date" id="dateDisplay"></div>
  </div>
  <div class="container">

    <div class="section">
      <div class="section-title">食材</div>
      <div class="item" onclick="toggle(this)"><input type="checkbox"><label>ヒロ・コーポレーション（食材全般）</label></div>
      <div class="item" onclick="toggle(this)"><input type="checkbox"><label>一番（イチゴ）</label></div>
      <div class="item" onclick="toggle(this)"><input type="checkbox"><label>アサイーピューレ</label></div>
      <div class="item" onclick="toggle(this)"><input type="checkbox"><label>コムハニー</label></div>
      <div class="item" onclick="toggle(this)"><input type="checkbox"><label>ピーナッツバター</label></div>
      <div class="item" onclick="toggle(this)"><input type="checkbox"><label>きな粉</label></div>
      <div class="item" onclick="toggle(this)"><input type="checkbox"><label>こしあん</label></div>
      <div class="item" onclick="toggle(this)"><input type="checkbox"><label>ヨーグルト</label></div>
      <div class="item" onclick="toggle(this)"><input type="checkbox"><label>ピスタチオペースト</label></div>
      <div class="item" onclick="toggle(this)"><input type="checkbox"><label>紅茶（アムシュティー）</label></div>
    </div>

    <div class="section">
      <div class="section-title">資材</div>
      <div class="item" onclick="toggle(this)"><input type="checkbox"><label>エフピコインターパック</label></div>
      <div class="item" onclick="toggle(this)"><input type="checkbox"><label>ヒロ・コーポレーション（資材一部）</label></div>
      <div class="item" onclick="toggle(this)"><input type="checkbox"><label>ネット注文</label></div>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">0 / 0 完了</div>
    <button class="reset-btn" onclick="resetAll()">リセット</button>
  </div>

  <script>
    document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('ja-JP', { year:'numeric', month:'long', day:'numeric', weekday:'long' });

    function toggle(el) {
      const cb = el.querySelector('input[type="checkbox"]');
      cb.checked = !cb.checked;
      el.classList.toggle('checked', cb.checked);
      updateProgress();
    }

    function updateProgress() {
      const all = document.querySelectorAll('.item input[type="checkbox"]');
      const done = document.querySelectorAll('.item input[type="checkbox"]:checked');
      const pct = all.length ? Math.round(done.length / all.length * 100) : 0;
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressText').textContent = done.length + ' / ' + all.length + ' 完了 (' + pct + '%)';
    }

    function resetAll() {
      if (!confirm('チェックをすべてリセットしますか？')) return;
      document.querySelectorAll('.item').forEach(el => {
        el.querySelector('input').checked = false;
        el.classList.remove('checked');
      });
      updateProgress();
    }

    updateProgress();
  </script>
</body>
</html>
