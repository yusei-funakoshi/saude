<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>発注計算</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; background: #f4f4f4; color: #1a1a1a; padding: 20px 14px 48px; }
    .container { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 20px; font-weight: 700; }
    .subtitle { font-size: 13px; color: #888; margin: 4px 0 18px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px; overflow: hidden; }
    .card-head { background: #8e44ad; color: #fff; font-weight: 700; font-size: 14px; padding: 11px 16px; }
    .card-body { padding: 14px 16px; }
    .row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .row:last-child { margin-bottom: 0; }
    label { font-size: 13px; font-weight: 600; color: #555; }
    input[type="number"] { width: 110px; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; text-align: right; -moz-appearance: textfield; }
    input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input:focus { outline: none; border-color: #8e44ad; }
    .seg { display: inline-flex; border: 1px solid #d2b4de; border-radius: 8px; overflow: hidden; }
    .seg button { background: #fff; border: none; padding: 8px 14px; font-size: 13px; cursor: pointer; color: #6c3483; }
    .seg button.active { background: #8e44ad; color: #fff; font-weight: 700; }
    .hint { font-size: 12px; color: #999; }
    .calc-btn { display: block; width: 100%; padding: 14px; background: #8e44ad; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
    .calc-btn:hover { background: #6c3483; }
    details.inv { margin-top: 4px; }
    details.inv summary { cursor: pointer; font-size: 13px; color: #6c3483; font-weight: 600; padding: 6px 0; }
    .inv-cat { font-size: 12px; font-weight: 700; color: #8e44ad; margin: 12px 0 6px; }
    .inv-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px solid #f3eafa; }
    .inv-item span { font-size: 13px; }
    .inv-item input { width: 78px; padding: 5px 8px; font-size: 14px; }
    .result-cat { font-size: 13px; font-weight: 700; color: #6c3483; background: #f3eafa; padding: 7px 16px; }
    .order-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 16px; border-bottom: 1px solid #faf5ff; font-size: 14px; }
    .order-row .nm { flex: 1; }
    .order-row .nm small { color: #aaa; font-size: 11px; }
    .order-row .qty { font-weight: 700; min-width: 64px; text-align: right; }
    .order-row.shortage .qty { color: #c0392b; }
    .order-row.zero { color: #bbb; }
    .order-row.zero .qty { color: #ccc; }
    .copy-btn { display: block; width: 100%; padding: 11px; background: #fff; color: #6c3483; border: 1px solid #d2b4de; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 12px; }
    .copy-btn:hover { background: #f9f5ff; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .note { font-size: 12px; color: #999; margin-top: 8px; line-height: 1.6; }
  </style>
</head>
<body>
<div class="container">
  <h1>発注計算</h1>
  <p class="subtitle">予測（杯数 or 売上）と在庫を入れると、発注数が全品出ます</p>

  <!-- 予測入力 -->
  <div class="card">
    <div class="card-head">予測</div>
    <div class="card-body">
      <div class="row">
        <label>入力方法</label>
        <div class="seg" id="mode-seg">
          <button data-mode="cups" class="active">杯数</button>
          <button data-mode="sales">売上(円)</button>
        </div>
      </div>
      <div class="row" id="cups-row">
        <label for="servings">想定杯数</label>
        <input type="number" id="servings" min="0" step="1" value="50" />
        <span class="hint">アサイーボウル＆スムージーに適用</span>
      </div>
      <div class="row" id="sales-row" style="display:none">
        <label for="sales">想定売上</label>
        <input type="number" id="sales" min="0" step="1000" placeholder="90000" />
        <label for="price">客単価</label>
        <input type="number" id="price" min="1" step="50" value="1800" />
      </div>
      <div class="row">
        <label>発注スパン</label>
        <div class="seg" id="span-seg">
          <button data-span="daily" class="active">1日分</button>
          <button data-span="twoDay">2日分</button>
        </div>
      </div>

      <details class="inv">
        <summary>現在の在庫を入力する（任意・未入力は0）</summary>
        <div id="inv-list"></div>
      </details>
    </div>
  </div>

  <button class="calc-btn" id="calc">発注数を計算</button>

  <!-- 結果 -->
  <div class="card" id="result-card" style="display:none; margin-top:16px;">
    <div class="card-head" id="result-head">発注リスト</div>
    <div id="result-list"></div>
    <div class="card-body">
      <button class="copy-btn" id="copy">テキストでコピー</button>
      <p class="note">赤字＝発注が必要な品。資材は最低在庫まで補充する数（1日/2日で変わりません）。</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { RECIPE } from './recipe.js';
  import { computeOrders, salesToServings, invKey } from './calc.js';

  let mode = 'cups';
  let span = 'daily';

  // 在庫入力UIをカテゴリ別に生成
  const invList = document.getElementById('inv-list');
  const cats = [...new Set(RECIPE.map((i) => i.category))];
  for (const cat of cats) {
    const h = document.createElement('div');
    h.className = 'inv-cat';
    h.textContent = cat;
    invList.appendChild(h);
    for (const item of RECIPE.filter((i) => i.category === cat)) {
      const row = document.createElement('div');
      row.className = 'inv-item';
      const key = invKey(item);
      row.innerHTML = `<span>${item.name} <small>${item.spec}</small></span>`;
      const inp = document.createElement('input');
      inp.type = 'number'; inp.min = '0'; inp.step = '1'; inp.placeholder = '0';
      inp.dataset.key = key;
      row.appendChild(inp);
      invList.appendChild(row);
    }
  }

  // セグメント切替
  document.getElementById('mode-seg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    mode = b.dataset.mode;
    document.querySelectorAll('#mode-seg button').forEach((x) => x.classList.toggle('active', x === b));
    document.getElementById('cups-row').style.display = mode === 'cups' ? '' : 'none';
    document.getElementById('sales-row').style.display = mode === 'sales' ? '' : 'none';
  });
  document.getElementById('span-seg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    span = b.dataset.span;
    document.querySelectorAll('#span-seg button').forEach((x) => x.classList.toggle('active', x === b));
  });

  function readInventory() {
    const inv = {};
    document.querySelectorAll('#inv-list input[data-key]').forEach((inp) => {
      const v = parseFloat(inp.value);
      if (!Number.isNaN(v) && v !== 0) inv[inp.dataset.key] = v;
    });
    return inv;
  }

  function currentServings() {
    if (mode === 'sales') {
      const sales = parseFloat(document.getElementById('sales').value) || 0;
      const price = parseFloat(document.getElementById('price').value) || 0;
      const s = salesToServings(sales, price);
      return s == null ? 0 : s;
    }
    return parseFloat(document.getElementById('servings').value) || 0;
  }

  let lastOrders = [];

  document.getElementById('calc').addEventListener('click', () => {
    const servings = currentServings();
    const inventory = readInventory();
    const orders = computeOrders(RECIPE, { servings, smoothieServings: servings, inventory, span });
    lastOrders = orders;
    render(orders, servings);
  });

  function render(orders, servings) {
    const card = document.getElementById('result-card');
    const list = document.getElementById('result-list');
    document.getElementById('result-head').textContent =
      `発注リスト（${span === 'twoDay' ? '2日分' : '1日分'} ・ 想定${servings}杯）`;
    list.innerHTML = '';
    for (const cat of cats) {
      const items = orders.filter((o) => o.category === cat);
      const head = document.createElement('div');
      head.className = 'result-cat';
      head.textContent = cat;
      list.appendChild(head);
      for (const o of items) {
        const row = document.createElement('div');
        row.className = 'order-row' + (o.qty === 0 ? ' zero' : o.shortage ? ' shortage' : '');
        row.innerHTML = `<span class="nm">${o.name} <small>${o.spec}</small></span>` +
          `<span class="qty">${o.qty}${o.unit}</span>`;
        list.appendChild(row);
      }
    }
    card.style.display = '';
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  document.getElementById('copy').addEventListener('click', async () => {
    if (!lastOrders.length) return;
    const lines = [`発注リスト（${span === 'twoDay' ? '2日分' : '1日分'}）`];
    for (const cat of cats) {
      const items = lastOrders.filter((o) => o.category === cat && o.qty > 0);
      if (!items.length) continue;
      lines.push(`\n【${cat}】`);
      for (const o of items) lines.push(`${o.name}: ${o.qty}${o.unit}`);
    }
    try {
      await navigator.clipboard.writeText(lines.join('\n'));
      toast('コピーしました');
    } catch {
      toast('コピーに失敗しました');
    }
  });

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }
</script>
</body>
</html>
