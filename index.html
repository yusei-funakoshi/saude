<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>saude</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 2rem; }
    h1 { font-size: 1.8rem; margin-bottom: 1.5rem; color: #333; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
    a { display: block; background: #fff; border-radius: 12px; padding: 1.2rem 1.5rem; text-decoration: none; color: #333; font-size: 1rem; font-weight: 500; box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: transform 0.15s, box-shadow 0.15s; }
    a:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
  </style>
</head>
<body>
  <h1>saude</h1>
  <div class="grid">
    <a href="checklist/">チェックリスト</a>
    <a href="inventory/">在庫管理</a>
    <a href="hygiene-checklist/">衛生チェックリスト</a>
    <a href="sales-sheet-checklist/">売上シートチェック</a>
    <a href="order-checklist/">発注チェックリスト</a>
  </div>
</body>
</html>
